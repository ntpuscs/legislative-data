name: 法規資料庫同步

on:
  # 允許在 GitHub 上手動觸發
  workflow_dispatch:
    inputs:
      reason:
        description: '觸發原因（選填，僅供紀錄）'
        required: false
        default: ''
  
  schedule:
    # 設定排程：每天 UTC 18:30 (相當於 UTC+8 臺北時間凌晨 02:30) 執行
    - cron: '30 18 * * *'

  repository_dispatch:     # 允許透過 GitHub API 從網站後台觸發
    types: [refresh-bylaws]

jobs:
  sync-and-update:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. 取得現行程式碼
        uses: actions/checkout@v4
        with:
          # 設定 fetch depth 為0以便在稍後 git pull
          fetch-depth: 0

      - name: 2. 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: 4. 安裝 Python 相依套件
        run: pip install gdown

      - name: 5-1. 安裝 pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
          run_install: false

      - name: 5-2. 安裝 Node.js 相依套件
        run: pnpm install

      - name: 6. 從 Google Drive 同步法規檔案
        run: |
          echo "Creating temporary download directory..."
          mkdir temp_drive_download
          
          echo "Downloading from Google Drive (法規上傳區共用資料夾)..."
          gdown --folder 12pfhU4BD47k58wGX4Tn1iz1whfIlt7D4 -O ./temp_drive_download/
          
          echo "Cleaning old regulations directory..."
          rm -rf ./data/bylaws
          mkdir -p ./data/bylaws
          
          echo "Moving and flattening all .txt files..."
          # 將臨時資料夾中所有檔案移動
          find ./temp_drive_download -name "*.txt" | while read f; do
            mv "$f" "./data/bylaws/$(basename "${f%.txt}.md")"
          done
          
          echo "Cleaning up temporary directory..."
          rm -rf temp_drive_download

      - name: 7. 更新法規檔案、Commit, Push
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REASON: ${{ github.event.inputs.reason }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "github-actions-bot@users.noreply.github.com"
          git config --global core.autocrlf false
          
          if [ -n "$(git status --porcelain ./data/bylaws/)" ]; then
            echo "偵測到法規檔案變動，開始執行列表更新..."
            
            node scripts/fetchBylaws.mjs
            
            echo "將所有變更加入 Staging..."
            git add ./data/bylaws/
            git add data/bylaw-list.json
            
            if ! git diff --staged --quiet; then
              echo "發現 Staged 變更，準備 commit..."
              
              if [ "$EVENT_NAME" = "schedule" ]; then
                COMMIT_BODY="觸發原因：定期自動執行"
              elif [ -n "$INPUT_REASON" ]; then
                COMMIT_BODY="觸發原因：使用者手動更新，並註明事由為「${INPUT_REASON}」。"
              else
                COMMIT_BODY="觸發原因：使用者手動更新"
              fi
              
              git commit -m "data(bylaws): 從 Google Drive 同步法規" -m "$COMMIT_BODY"
              
              git pull --rebase
              git push
            else
              echo "法規檔案內容雖有變動，但清單（僅有編號與簡稱）無需更新。"
            fi
            
          else
            echo "Google Drive 上沒有異動。"
          fi
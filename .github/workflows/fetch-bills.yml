# .github/workflows/fetch-bills.yml
#
# 觸發時機：
#   1. 自動執行：每天早上凌晨二時
#   2. 在 GitHub Actions 頁面手動按下 "Run workflow" 按鈕
#   3. 網站後台透過 GitHub API 觸發（repository_dispatch，event type: refresh-bills）

name: 同步議案資料

permissions:
  contents: write

on:
  schedule:
    # 每天 18:00 (UTC) 執行，對應台灣時間早上 02:00
    - cron: "0 18 * * *"
  workflow_dispatch: # 允許從介面手動觸發
    inputs:
      reason:
        description: "觸發原因（選填，僅供紀錄）"
        required: false
        default: ""

  repository_dispatch: # 允許透過 GitHub API 從網站後台觸發
    types: [refresh-bills]

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Fetch and parse Google Sheets data
        env:
          BILLS_SHEET_ID: ${{ secrets.BILLS_SHEET_ID }}
          BILLS_SHEET_GID: ${{ secrets.BILLS_SHEET_GID }}
        run: node scripts/fetchBills.mjs

      - name: Check for changes and Commit
        id: auto-commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: |
            data(bills): 從 Google Sheets 同步議案資料

            觸發原因：${{ github.event_name == 'schedule' && '每日自動執行' || github.event_name == 'repository_dispatch' && '透過 API 觸發' || github.event.inputs.reason != '' && format('使用者從介面手動更新，事由：「{0}」', github.event.inputs.reason) || '使用者從介面手動更新' }}
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          file_pattern: "data/*.json"

      - name: 清除 jsDelivr 快取
        if: steps.auto-commit.outputs.changes_detected == 'true'
        run: |
          curl https://purge.jsdelivr.net/gh/ntpusu/legislative-data@main/data/bill_latestTerm.json
          curl https://purge.jsdelivr.net/gh/ntpusu/legislative-data@main/data/bill_pastTerms.json
